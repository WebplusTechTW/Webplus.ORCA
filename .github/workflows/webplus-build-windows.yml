# Webplus fork：main 更新時建置 Windows 安裝檔，發佈到固定的 Release「windows-installer」。
# Release 不會過期；每次建置會覆蓋舊的安裝檔並把 tag 移到新的 commit，所以永遠只保留一版。
# 步驟沿用上游 dev-channel-win-build.yml。安裝檔用內部 WebplusCA 簽發的程式碼簽章憑證（CN=Webplus）簽章，
# 憑證放在 secrets WIN_CSC_PFX_BASE64 / WIN_CSC_PASSWORD；沒設定時照舊產出未簽章的安裝檔。
name: Webplus Windows installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 要建置的分支、tag 或 commit
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

# 只保留一版安裝檔，新的建置取代進行中的舊建置。
concurrency:
  group: webplus-build-windows
  cancel-in-progress: true

env:
  RELEASE_TAG: windows-installer
  ASSET_NAME: webplus-orca-windows-setup.exe

jobs:
  build-win:
    if: github.repository == 'WebplusTechTW/Webplus.ORCA'
    # 與上游相同固定 windows-2022：windows-latest 的 VS 版本 node-gyp 偵測不到。
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # pnpm 必須在 setup-node 之前，setup-node 才找得到 store。
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      # Electron 二進位檔下載偶爾 504，重試避免整個建置失敗。
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # electron-builder 打包前需要 mobile web bundle，它依賴 mobile/node_modules。
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build Windows process-table addon for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Build app
        shell: bash
        run: pnpm build:release
        env:
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'

      - name: Package installer
        shell: bash
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          ORCA_BUILD_COMMIT=$(git rev-parse HEAD) pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          cp dist/orca-windows-setup.exe "dist/$ASSET_NAME"

      # 只簽外層安裝檔；加時間戳記，憑證到期後已簽的檔案仍有效。
      # runner 不信任 WebplusCA，所以不跑 signtool verify，改檢查簽署者是否為預期的憑證。
      - name: Sign installer
        shell: pwsh
        env:
          WIN_CSC_PFX_BASE64: ${{ secrets.WIN_CSC_PFX_BASE64 }}
          WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_PFX_BASE64) {
            Write-Warning '未設定 WIN_CSC_PFX_BASE64，安裝檔不簽章'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_PFX_BASE64))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw '找不到 signtool.exe' }
            $target = "dist\$env:ASSET_NAME"
            & $signtool.FullName sign /f $pfx /p $env:WIN_CSC_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $signer = (Get-AuthenticodeSignature $target).SignerCertificate
            if (-not $signer) { throw '簽章後讀不到簽署者憑證' }
            Write-Host "已簽章：$($signer.Subject)（有效至 $($signer.NotAfter.ToString('yyyy-MM-dd'))）"
            "INSTALLER_SIGNED=1" >> $env:GITHUB_ENV
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # 先移動 tag、再覆蓋檔案，過程中 Release 一直有可下載的安裝檔。
      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          version=$(node -p "require('./package.json').version")
          title="Webplus Orca ${version}（Windows 安裝檔）"
          if [ "${INSTALLER_SIGNED:-}" = "1" ]; then
            sign_note="安裝檔已用公司憑證簽章（發行者 Webplus）。建議用 \`gh release download ${RELEASE_TAG} -R ${GITHUB_REPOSITORY} -p '*.exe'\` 下載，不會跳出「Windows 已保護您的電腦」；用瀏覽器下載若仍跳出，點「其他資訊」確認發行者為 Webplus 後按「仍要執行」。"
          else
            sign_note="安裝檔沒有數位簽章，Windows 跳出「Windows 已保護您的電腦」時，點「其他資訊」›「仍要執行」。"
          fi
          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "Webplus.ORCA（正體中文）Windows 安裝檔。版本 ${version}，commit ${short}，建置時間 $(date -u '+%Y-%m-%d %H:%M UTC')。" \
            "$sign_note" \
            "此 Release 只保留最新一版，main 更新後會自動覆蓋。")
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$sha" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" --verify-tag --title "$title" --notes "$notes" --latest
          fi
          echo "已發佈：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
