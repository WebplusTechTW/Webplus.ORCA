# Webplus fork：main 更新時建置 Windows 安裝檔（未簽章），發佈到固定的 Release「windows-installer」。
# Release 不會過期；每次建置會覆蓋舊的安裝檔並把 tag 移到新的 commit，所以永遠只保留一版。
# 步驟沿用上游 dev-channel-win-build.yml，但不需要任何 secrets。
name: Webplus Windows installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 要建置的分支、tag 或 commit
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: write

# 只保留一版安裝檔，新的建置取代進行中的舊建置。
concurrency:
  group: webplus-build-windows
  cancel-in-progress: true

env:
  RELEASE_TAG: windows-installer
  ASSET_NAME: webplus-orca-windows-setup.exe

jobs:
  build-win:
    if: github.repository == 'WebplusTechTW/Webplus.ORCA'
    # 與上游相同固定 windows-2022：windows-latest 的 VS 版本 node-gyp 偵測不到。
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      # pnpm 必須在 setup-node 之前，setup-node 才找得到 store。
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      # Electron 二進位檔下載偶爾 504，重試避免整個建置失敗。
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # electron-builder 打包前需要 mobile web bundle，它依賴 mobile/node_modules。
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build Windows process-table addon for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Build app
        shell: bash
        run: pnpm build:release
        env:
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'

      - name: Package installer
        shell: bash
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          ORCA_BUILD_COMMIT=$(git rev-parse HEAD) pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          cp dist/orca-windows-setup.exe "dist/$ASSET_NAME"

      # 先移動 tag、再覆蓋檔案，過程中 Release 一直有可下載的安裝檔。
      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          version=$(node -p "require('./package.json').version")
          title="Webplus Orca ${version}（Windows 安裝檔）"
          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "Webplus.ORCA（正體中文）Windows 安裝檔。版本 ${version}，commit ${short}，建置時間 $(date -u '+%Y-%m-%d %H:%M UTC')。" \
            "安裝檔沒有數位簽章，Windows 跳出「Windows 已保護您的電腦」時，點「其他資訊」›「仍要執行」。" \
            "此 Release 只保留最新一版，main 更新後會自動覆蓋。")
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$sha" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" --verify-tag --title "$title" --notes "$notes" --latest
          fi
          echo "已發佈：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
