# Webplus fork 每週同步流程：
#   stablyai/orca main ─鏡像→ upstream/main ─合併＋重新產生 zh-TW→ zh-tw ─合併→ main ─建置→ Windows 安裝檔（Release）
# main 受組織規則保護；沒有權限直接推送時，改提供 zh-tw → main 的 PR，合併後由 webplus-build-windows.yml 建置。
name: Webplus upstream sync

on:
  schedule:
    # 台灣時間每週一 00:00（UTC 週日 16:00）
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: webplus-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'WebplusTechTW/Webplus.ORCA'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      main_pushed: ${{ steps.main.outputs.pushed }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_URL: https://github.com/stablyai/orca.git
      MIRROR_BRANCH: upstream/main
      ZH_TW_BRANCH: zh-tw
      ZH_TW_CATALOG: src/renderer/src/i18n/locales/zh-TW.json
    steps:
      # 設定 WEBPLUS_SYNC_TOKEN（可略過 main 保護規則的 token）時，main 也能自動合併。
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.WEBPLUS_SYNC_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 搭配 main 上 .gitattributes 的 README.md merge=ours，保留本專案 README。
          git config merge.ours.driver true

      - name: 更新 upstream/main（原作者版本的鏡像）
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          if [ "$(git rev-parse upstream/main)" = "$(git rev-parse "origin/$MIRROR_BRANCH")" ]; then
            echo "- upstream/main 已是最新（$(git rev-parse --short upstream/main)）" >> "$GITHUB_STEP_SUMMARY"
          else
            git push --force origin "refs/remotes/upstream/main:refs/heads/$MIRROR_BRANCH"
            echo "- upstream/main 更新為 $(git rev-parse --short upstream/main)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 合併 upstream/main 到 zh-tw
        run: |
          git checkout -B "$ZH_TW_BRANCH" "origin/$ZH_TW_BRANCH"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "- zh-tw 已包含 upstream/main" >> "$GITHUB_STEP_SUMMARY"
          elif ! git merge --no-ff --no-edit -m "chore: 合併上游 stablyai/orca main（$(git rev-parse --short upstream/main)）" upstream/main; then
            {
              echo "## upstream/main 合併到 zh-tw 發生衝突，需要手動處理"
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
              echo "請依 README「手動同步」一節在本機合併。"
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 產生腳本只需要 opencc-js，不必安裝整個專案的相依套件。
      - name: 重新產生正體中文語系並推送 zh-tw
        run: |
          version=$(node -p "require('./package.json').devDependencies['opencc-js']")
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/opencc" "opencc-js@${version}"
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/opencc/node_modules/opencc-js" node_modules/opencc-js
          node config/scripts/generate-zh-tw-catalog.mjs
          node config/scripts/generate-zh-tw-catalog.mjs --check
          rm node_modules/opencc-js
          git add "$ZH_TW_CATALOG"
          if ! git diff --cached --quiet; then
            git commit -m "chore(i18n): 同步上游後重新產生 zh-TW 語系"
            echo "- zh-TW 語系已重新產生" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$ZH_TW_BRANCH")" ]; then
            git push origin "$ZH_TW_BRANCH"
            echo "- zh-tw 已推送 $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 合併 zh-tw 到 main
        id: main
        run: |
          git checkout -B main origin/main
          if git merge-base --is-ancestor "$ZH_TW_BRANCH" HEAD; then
            echo "- main 已包含 zh-tw，無需更新" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-ff --no-edit -m "chore: 合併 zh-tw（上游 $(git rev-parse --short upstream/main)）" "$ZH_TW_BRANCH"; then
            {
              echo "## zh-tw 合併到 main 發生衝突，需要手動處理"
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
              echo "請依 README「手動同步」一節在本機合併。"
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          if git push origin main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "- main 已合併 zh-tw 並推送，接著建置安裝檔" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 沒有權限直接推送 main：改用 PR，合併後 push 事件會觸發安裝檔建置。
          body="自動同步：將 \`zh-tw\`（上游 $(git rev-parse --short upstream/main) ＋ 正體中文）合併到 \`main\`。請使用 **Create a merge commit** 合併，不要用 Squash 或 Rebase。合併後會自動建置 Windows 安裝檔。"
          existing=$(gh pr list --head "$ZH_TW_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "- main 無法直接推送，已有待合併的 PR #${existing}" >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base main --head "$ZH_TW_BRANCH" --title "同步上游並合併正體中文（$(git rev-parse --short upstream/main)）" --body "$body"; then
            echo "- main 無法直接推送，已建立 PR" >> "$GITHUB_STEP_SUMMARY"
          else
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${ZH_TW_BRANCH}?expand=1"
            {
              echo "## 需要手動合併 zh-tw 到 main"
              echo
              echo "main 受保護且無法自動建立 PR，請開啟以下連結建立 PR 並合併（Create a merge commit）：${compare}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 上游的 CI／部署／排程 workflow 在 fork 中沒有對應的 runner 與 secrets，合併進來的新 workflow 一律停用。
      - name: 停用上游帶來的 workflow
        if: always()
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[]
              | select(.state == "active")
              | select(.path | startswith(".github/workflows/"))
              | select(.path | startswith(".github/workflows/webplus-") | not)
              | "\(.id)\t\(.path)"' |
          while IFS=$'\t' read -r id path; do
            echo "停用 ${path}"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" || true
          done

  # 以 GITHUB_TOKEN 推送不會觸發 push 事件，所以由這裡直接呼叫建置；重複觸發時建置 workflow 的 concurrency 只保留最新一次。
  build-windows:
    needs: sync
    if: needs.sync.outputs.main_pushed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/webplus-build-windows.yml
    with:
      ref: main
